name: HACS Action

on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  validate:
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout
        uses: 'actions/checkout@v7'
      - name: HACS Action
        uses: 'hacs/action@main'
        with:
          category: 'integration'
          ignore: "archived brands"